<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leela Bazar</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Meta -->
  <meta name="description" content="Leela Bazar – Result & Chart Management" />
  <!-- Icons -->
  <link rel="icon" href="Logo.jpg" />
  <meta name="theme-color" content="#FED7AA" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="bg-gray-100">
  <!-- HEADER -->
  <header class="fixed w-full top-0 left-0 bg-orange-200 p-4 shadow rounded-b-3xl">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="font-bold text-xl">Leela Bazar</h1>
      </div>
      <button title="add data" onclick="openForm()" class="text-xl"><i class="fa fa-plus"></i></button>
    </div>

    <!-- Filters -->
    <div class="grid relative grid-cols-3 gap-2 mt-3 ">
      <select id="filterName" title="Game Name"
        class="p-2 rounded bg-white  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0"
        onchange="applyFilters()">
        <option value="">All Types</option>
        <option value="LEELA BAZAR">LEELA BAZAR</option>
        <option value="Golden">Golden</option>
        <option value="Final">Final</option>
        <option value="MORNING SYNDICATE">SYNDICATE</option>
        <option value="KALYAN">KALYAN</option>
        <option value="SYNDICATE NIGHT">SYNDICATE NIGHT</option>
        <option value="RAJDHANI NIGHT">RAJDHANI NIGHT</option>
        <option value="SHAKTIMAAN">SHAKTIMAAN</option>
      </select>

      <select id="filterDay" title="Days"
        class="p-2 rounded bg-white  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0"
        onchange="applyFilters()">
        <option value="">All Days</option>
        <option>MONDAY</option>
        <option>TUESDAY</option>
        <option>WEDNESDAY</option>
        <option>THURSDAY</option>
        <option>FRIDAY</option>
        <option>SATURDAY</option>
        <option>SUNDAY</option>
      </select>

      <input title="Date" type="date" id="filterDate"
        class="py-2 rounded bg-white w-[100%] focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0  "
        oninput="applyFilters()" />
    </div>
  </header>

  <!-- DATA GRID -->
  <main class="p-2 mt-[33%] md:mt-[10%] max-h-[120%]">
    <div id="grid" class="grid grid-cols-2 md:grid-cols-5 gap-2">
      <div class="fixed inset-0 flex items-center justify-center bg-black/40 z-50">
        <div class="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
      </div>
    </div>
  </main>

  <div id="loader" class="hidden fixed inset-0 flex items-center justify-center bg-black/40 z-50">
    <div class="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
  </div>
  
  <!-- MODAL -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-end z-40">
    <div class="bg-white w-full rounded-t-3xl p-4">
      <div class="flex justify-between mb-2">
        <h2 class="font-bold text-lg">Update Record</h2>
        <button onclick="closeForm()">✕</button>
      </div>

      <form id="form" class="justify-center w-full">
        <input type="hidden" name="Id" id="Id" />
        <input type="hidden" name="Category" value="single" />
        
        <div class="flex justify-between gap-2">
          <select type="color" title="Mcolor" name="Mcolor" data-empty required
            class="w-full mt-2 h-14 border px-3 border-black text-black font-bold rounded cursor-pointer"
            onchange="this.style.backgroundColor=this.value; this.style.color='#000000'">
            <option value="#fff1e1" style="background:#fff1e1;color:black;">Peach</option>
            <option value="#f7eebb" style="background:#f7eebb;color:black;">Gold</option>
            <option value="#d2f8e0" style="background:#d2f8e0;color:black;">Green</option>
            <option value="#d6e0f5" style="background:#d6e0f5;color:black;">Blue</option>
            <option value="#f5d1d1" style="background:#f5d1d1;color:black;">Red</option>
            <option value="#ebdbc1" style="background:#ebdbc1;color:black;">Amber</option>
          </select>
          <select title="Game Name" name="Name" required
            class="w-full mt-2 h-14 border px-3 border-black text-black font-bold rounded cursor-pointer">
            <option value="LEELA BAZAR">LEELA BAZAR</option>
            <option value="MORNING SYNDICATE">SYNDICATE</option>
            <option value="KALYAN">KALYAN</option>
            <option value="SYNDICATE NIGHT">SYNDICATE NIGHT</option>
            <option value="RAJDHANI NIGHT">RAJDHANI NIGHT</option>
            <option value="SHAKTIMAAN">SHAKTIMAAN</option>
            <option value="Golden">Golden</option>
            <option value="Final">Final</option>
          </select>
        </div>
        
        <div class="flex justify-between gap-2">
          <input title="Date" type="date" name="Date" required
            class="w-full mt-2 h-14  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0 border px-3 border-black text-black font-bold rounded cursor-pointer" />

          <select title="Days" name="Day" required
            class="w-full mt-2 h-14 border px-3  border-black text-black font-bold rounded cursor-pointer">
            <option value="MONDAY">Monday</option>
            <option value="TUESDAY">Tuesday</option>
            <option value="WEDNESDAY">Wednesday</option>
            <option value="THURSDAY">Thursday</option>
            <option value="FRIDAY">Friday</option>
            <option value="SATURDAY">Saturday</option>
            <option value="SUNDAY">Sunday</option>
          </select>
        </div>
        
        <div class="flex justify-between gap-2">
          <input title="Start TIme" type="time" name="Time" required
            class="w-full mt-2 h-14 border  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0 px-3 border-black text-black font-bold rounded cursor-pointer gap-2" />
          <input title="ENd TIme" type="time" name="End" required
            class="w-full mt-2 h-14 border  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0 px-3 border-black text-black font-bold rounded cursor-pointer gap-2" />
        </div>
        
        <select name="Bcolor" title="Bcolor" data-empty
          class="w-full h-14 mt-2 border border-black rounded font-bold px-3" onchange="this.style.backgroundColor=this.value;
            this.style.color=['#FDBA74','#FFD700','#F59E0B'].includes(this.value)?'#000':'#fff';">
          <option value="#000000" style="background:#000000;color:white;">Black</option>
          <option value="#DC2626" style="background:#DC2626;color:white;">Red</option>
        </select>

        <div class="flex justify-between gap-2">
          <!-- FIX: Changed type="number" to type="text" with numeric input modes -->
          <input type="text" inputmode="numeric" pattern="[0-9]*" name="Jodi" placeholder="Jodi"
            class="w-full mt-2 h-14 border  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0 px-3 border-black text-black font-bold rounded cursor-pointer gap-2" />
            
          <input type="number" inputmode="numeric" pattern="[0-9]*" name="Marks" placeholder="Marks"
            class="w-full mt-2 h-14 border px-3  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0 border-black text-black font-bold rounded cursor-pointer gap-2" />
            
          <input type="text" inputmode="numeric" pattern="[0-9]*" name="Pennel" placeholder="Panel"
            class="w-full mt-2 h-14 border px-3  focus:outline-none focus:ring-0 ring-0 focus:ring-offset-0 border-black text-black font-bold rounded cursor-pointer gap-2" />
        </div>

        <button type="submit" id="Save"
          class="w-full mt-2 h-14 border px-3 border-black text-black font-bold rounded cursor-pointer bg-blue-600 text-white ">SAVE</button>
      </form>
    </div>
  </div>
  
  <div id="success" class="fixed inset-0 hidden z-50 bg-black/40 flex items-center justify-center">
    <div class="bg-white px-8 py-6 rounded-xl font-bold text-green-600 shadow-lg">
      ✅ Submitted Successfully
    </div>
  </div>
 <!-- Alert Popup -->
  <div
    id="alertPopup"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
  >
    <div class="relative w-full max-w-sm rounded-2xl border border-green-100
                bg-white p-6 text-center shadow-2xl">
      <!-- Icon -->
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center
                  rounded-full bg-green-100 text-3xl text-green-700">
        ✔
      </div>

      <!-- Heading -->
      <h2 class="mb-2 text-xl font-extrabold text-green-800">
        महत्वपूर्ण सूचना !
      </h2>

      <!-- Hindi Message -->
      <p class="mb-6 text-base leading-7 text-gray-900">
        आप 0 का इस्तेमाल कर सकते हैं।
      </p>

      <!-- Close Button -->
      <button
        onclick="closePopup()"
        class="w-full rounded-xl bg-green-600 px-5 py-3 font-semibold
               text-white shadow-md transition hover:bg-green-700
               active:scale-95"
      >
        ठीक है, समझ गया
      </button>

    </div>
  </div>

  <script>
    function closePopup() {
      document.getElementById("alertPopup").classList.add("hidden");
    }
  </script>

<script>
    const API = "https://script.google.com/macros/s/AKfycbwKmjk8_4zk_uCa6vN9S05o-7axymyH1sRY6lImxL3PZYhpMUDrTI4ePlx3Zn_gMpzyJQ/exec";
    
    let records = [];

    // Fetch Data
    async function loadData() {
      try {
        const res = await fetch(API, { redirect: "follow" });
        const text = await res.text();
        const data = JSON.parse(text);
        
        const rawRecords = data.records ? data.records : data;
        records = rawRecords.reverse();
        render(records);
      } catch (err) {
        console.error("Failed to fetch data", err);
      }
    }

    // Helper function to remove the hidden quote if Google sends it back
    function cleanValue(val, fallback) {
      if (val === undefined || val === null || val === "") return fallback;
      return String(val).replace(/^'/, ""); // Removes leading apostrophe
    }

    // Render Data to Grid
    function render(list) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      list.forEach(r => {
        const card = document.createElement("div");
        card.className = "bg-white p-2 rounded shadow text-sm cursor-pointer hover:bg-orange-50 transition";
        
        // Safely extract numbers and remove the Google Sheets text-forcing quote
        const safeJodi = cleanValue(r.Jodi, "**");
        const safeMarks = cleanValue(r.Marks, "***");
        const safePennel = cleanValue(r.Pennel, "***");

        card.innerHTML = `
          <div onclick='edit(${JSON.stringify(r)})'>
            <div class="flex justify-between border-b pb-1 mb-1 border-gray-200">
              <b class="text-blue-900">${r.Date || "N/A"}</b>
              <span class="text-gray-500 font-semibold">${r.Day || ""}</span>
            </div>
            <div class="font-bold text-center mx-auto text-lg uppercase my-2">${r.Name || "Unnamed"}</div>
            <div class="text-pink-600 font-extrabold flex justify-center gap-2 text-lg">
              <span style="color:${r.Bcolor || '#db2777'}">${safeJodi}</span>
              <span class="text-gray-400">-</span>
              <span style="color:${r.Ccolor || '#db2777'}">${safeMarks}</span>
              <span class="text-gray-400">-</span>
              <span style="color:${r.Acolor || '#db2777'}">${safePennel}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filters
    function applyFilters() {
      const n = document.getElementById("filterName").value;
      const d = document.getElementById("filterDay").value;
      const dt = document.getElementById("filterDate").value;

      render(records.filter(r =>
        (!n || r.Name === n) &&
        (!d || r.Day === d) &&
        (!dt || r.Date === dt)
      ));
    }

    // Modal controls
    const modal = document.getElementById("modal");
    const form = document.getElementById("form");
    
    function openForm() {
      modal.classList.remove("hidden");
      document.getElementById("Save").textContent = "Create";
    }
    
    function closeForm() { 
      modal.classList.add("hidden"); 
      form.reset(); 
    }
    
    function edit(r) {
      openForm();
      document.getElementById("Save").textContent = "Update";
      
      // Clean quotes out of the edit form inputs too
      Object.keys(r).forEach(k => {
        if (form[k]) {
          form[k].value = String(r[k]).replace(/^'/, ""); 
        }
      });
    }

    function showSuccess() {
      const s = document.getElementById("success");
      s.classList.remove("hidden");
      setTimeout(() => {
        s.classList.add("hidden");
      }, 1500);
    }

    // Submit & Update Entry 
    const loader = document.getElementById("loader");

    function showLoader() { loader.classList.remove("hidden"); }
    function hideLoader() { loader.classList.add("hidden"); }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showLoader();
      
      const fd = new FormData(form);
      let payload = Object.fromEntries(fd.entries());
      
      // CRITICAL FIX: Prepend a single quote (') to force Google Sheets to treat it as TEXT
      if (payload.Jodi != null && payload.Jodi !== "") payload.Jodi = "'" + String(payload.Jodi).trim();
      if (payload.Marks != null && payload.Marks !== "") payload.Marks = "'" + String(payload.Marks).trim();
      if (payload.Pennel != null && payload.Pennel !== "") payload.Pennel = "'" + String(payload.Pennel).trim();

      let id = payload.Id;
      if (id && id.trim() !== "") {
        payload.action = "update";
      } else {
        id = Math.floor(100000 + Math.random() * 900000).toString();
        payload.Id = id;
        payload.action = "create";
      }

      try {
        await fetch(API, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        
        setTimeout(() => {
          loadData();
          hideLoader();
          closeForm();
          showSuccess();
        }, 1000);
        
      } catch (err) {
        console.error("Save failed:", err);
        hideLoader();
        alert("Failed to save data. Check console for details.");
      }
    });

    loadData();
  </script>
</body>
</html>
